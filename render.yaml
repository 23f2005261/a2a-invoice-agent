services:
  - type: web
    name: a2a-invoice-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_PATH
        value: /tmp/invoice_agent.sqlite3
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
